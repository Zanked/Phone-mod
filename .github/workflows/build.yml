name: Build Pink Phone

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Find and unpack project
        shell: bash
        run: |
          set -euxo pipefail

          echo "Repository contents:"
          ls -la

          mkdir -p /tmp/phone-project

          # Распаковать архивы в отдельные папки
          while IFS= read -r -d '' archive; do
            target="/tmp/phone-project/$(basename "$archive" .zip)"
            mkdir -p "$target"
            unzip -oq "$archive" -d "$target"
          done < <(find "$GITHUB_WORKSPACE" -type f -name '*.zip' -print0)

          # Искать проект и в репозитории, и в распакованных архивах
          PROJECT=""
          for root in "$GITHUB_WORKSPACE" /tmp/phone-project; do
            PROJECT=$(find "$root" -type f \
              \( -name build.gradle -o -name build.gradle.kts \) \
              -not -path '*/.gradle/*' \
              -print -quit | xargs -r dirname)

            if [ -n "$PROJECT" ]; then
              break
            fi
          done

          if [ -z "$PROJECT" ]; then
            echo "ERROR: Gradle project not found."
            echo "Upload the actual source project, not only a compiled JAR."
            echo "Expected build.gradle or build.gradle.kts."
            find "$GITHUB_WORKSPACE" /tmp/phone-project \
              -maxdepth 4 -type f | head -200
            exit 1
          fi

          echo "Found project: $PROJECT"
          echo "PROJECT_DIR=$PROJECT" >> "$GITHUB_ENV"

      - name: Build mod
        shell: bash
        run: |
          set -euxo pipefail
          cd "$PROJECT_DIR"

          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew --no-daemon build
          else
            echo "Gradle wrapper missing; using installed Gradle."
            gradle --no-daemon build
          fi

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: PinkPhone-NeoForge-1.21.1
          path: |
            ${{ env.PROJECT_DIR }}/build/libs/*.jar
          if-no-files-found: error
