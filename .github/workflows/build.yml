name: Build Pink Phone Mod

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Unpack project archive if present
        shell: bash
        run: |
          set -e
          if [ -f "PinkPhone-NeoForge-1.21.1-v6-horror-game.zip" ]; then
            mkdir -p extracted
            unzip -oq "PinkPhone-NeoForge-1.21.1-v6-horror-game.zip" -d extracted
            if [ -f extracted/gradlew ]; then
              cp -a extracted/. .
            fi
          fi

      - name: Make Gradle wrapper executable
        run: |
          if [ -f gradlew ]; then chmod +x gradlew; fi

      - name: Build mod
        run: |
          if [ -f ./gradlew ]; then
            ./gradlew --no-daemon build
          elif [ -f build.gradle ]; then
            gradle --no-daemon build
          elif [ -f build.gradle.kts ]; then
            gradle --no-daemon build
          else
            echo "Gradle build files not found!"
            exit 1
          fi

      - name: Upload mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: PinkPhone-NeoForge-1.21.1
          path: build/libs/*.jar
          if-no-files-found: error
